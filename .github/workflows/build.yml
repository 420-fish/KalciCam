# Builds the Linux AppImage on GitHub's machines, records a short test video
# with it, and (for version tags) publishes it on the Releases page.
name: Build KalciCam

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-22.04  # older glibc = the AppImage runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon-x11-0
      - name: Build AppImage
        env:
          PYTHON: python
        run: bash packaging/linux/build_appimage.sh
      - name: Unit tests
        run: python -m pip install -q -r requirements.txt && python tests/test_capture.py
      - name: Real recording test (packaged AppImage on a virtual X11 screen)
        run: |
          # A bare server lacks the X11 libraries every Linux desktop ships with.
          sudo apt-get install -y ffmpeg xvfb libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 \
            libxkbcommon-x11-0 libxkbcommon0 libegl1 libgl1 libfontconfig1 libdbus-1-3 libpulse0
          export QT_DEBUG_PLUGINS=1
          xvfb-run -a -s "-screen 0 1280x720x24 +extension RECORD" \
            dist/KalciCam-x86_64.AppImage --appimage-extract-and-run --selftest 2>&1 \
            | grep -v -E "^(QFactoryLoader|Got keys|checking directory|looking at)" ; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: KalciCam-Linux-AppImage
          path: dist/KalciCam-x86_64.AppImage

  # Pushing a tag like v1.1.0 publishes the AppImage on the Releases page,
  # but only if the build and the real recording test above passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" files/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "KalciCam ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
