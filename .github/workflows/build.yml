# Builds the Linux AppImage (and the Windows test zip) on GitHub's machines.
# Push this folder to a GitHub repo, open the Actions tab, run "Build KalciCam",
# and download the files from the run's Artifacts section.
name: Build KalciCam

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-22.04  # older glibc = the AppImage runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon-x11-0
      - name: Build AppImage
        env:
          PYTHON: python
        run: bash packaging/linux/build_appimage.sh
      - name: Self-test
        run: python -m pip install -q -r requirements.txt && python tests/test_capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: KalciCam-Linux-AppImage
          path: dist/KalciCam-x86_64.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KalciCam-Windows-Test
          path: dist/KalciCam-Windows-Test.zip

  # Pushing a tag like v1.0.0 publishes both builds on the repo's Releases page.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" files/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "KalciCam ${GITHUB_REF_NAME}" \
            --notes "**Linux:** download KalciCam-x86_64.AppImage, right-click > Properties > Allow executing as program, then double-click it. The setup wizard does the rest.

          **Windows (test build):** unzip KalciCam-Windows-Test.zip and run KalciCam.exe (needs FFmpeg: winget install Gyan.FFmpeg)."
